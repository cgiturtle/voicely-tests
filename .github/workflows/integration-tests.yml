name: Integration Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  run-integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libgbm-dev xvfb libxshmfence1

      - name: Install npm dependencies
        run: npm install  # ← CHANGED FROM npm ci TO npm install

      - name: Verify Chrome installation
        run: |
          chromium-browser --version
          which chromium-browser

      - name: Run Jest integration tests
        run: |
          xvfb-run --auto-servernum npx jest tests/voicely.test.js \
            --detectOpenHandles \
            --forceExit \
            --verbose \
            --reporters=default \
            --reporters=jest-junit
        env:
          CI: true
          DISPLAY: ':99'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/chromium-browser'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: screenshots/
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-results/junit.xml
          retention-days: 7
